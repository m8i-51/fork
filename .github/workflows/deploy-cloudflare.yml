name: Deploy

on:
  push:
    branches: [main]

env:
  DEPLOY_ENV: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build:app

      - run: npm run test

      - name: Render wrangler overlay
        if: vars.D1_DATABASE_ID != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
        run: node infra/scripts/render-wrangler-overlay.mjs ${{ env.DEPLOY_ENV }}

      - name: Apply D1 migrations (remote)
        if: vars.D1_DATABASE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote \
            --env "${{ env.DEPLOY_ENV }}" \
            -c wrangler.toml -c "infra/generated/wrangler.${{ env.DEPLOY_ENV }}.toml"

      - name: Deploy Worker (IaC overlay)
        if: vars.D1_DATABASE_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ env.DEPLOY_ENV }} -c wrangler.toml -c infra/generated/wrangler.${{ env.DEPLOY_ENV }}.toml

      - name: Deploy Worker (legacy — run infra:apply first)
        if: vars.D1_DATABASE_ID == ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
