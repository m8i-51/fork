name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/deploy-cloudflare.yml"
  push:
    branches: [main, "cursor/**"]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -recursive
        working-directory: .

      - run: terraform init -input=false

      - run: terraform validate

  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init -input=false

      - name: Terraform plan (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_environment: production
          TF_VAR_app_url: ${{ vars.APP_URL }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Skipping terraform plan — configure CLOUDFLARE_API_TOKEN to enable."
            exit 0
          fi
          if [[ -z "${TF_VAR_app_url:-}" ]]; then
            echo "Skipping terraform plan — configure APP_URL repository variable."
            exit 0
          fi
          terraform plan -input=false
